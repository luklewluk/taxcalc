# https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    trusted_hosts: '%env(TRUSTED_HOSTS)%'
    http_method_override: false
    handle_all_throwables: true

    # CSRF protection is used explicitly by the calculator controllers.
    csrf_protection: true

    # The session only ever stores CSRF tokens and flash messages.
    # No uploaded financial data is written to it - see docs/PRIVACY section in README.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: strict
        storage_factory_id: session.storage.factory.native
        gc_maxlifetime: 3600

    php_errors:
        log: true

    # Static files are cached for a year and marked immutable by the web server;
    # every asset() URL carries a hash of the file's content, so a changed file
    # gets a new URL and an unchanged one keeps its cache across deploys.
    assets:
        version_strategy: App\Web\Asset\ContentHashVersionStrategy

when@test:
    framework:
        test: true
        # BrowserKit uses localhost; keep tests independent of deployment-level
        # TRUSTED_HOSTS values such as a temporary Cloudflare tunnel hostname.
        trusted_hosts: ['^localhost$', '^127\\.0\\.0\\.1$']
        session:
            storage_factory_id: session.storage.factory.mock_file
