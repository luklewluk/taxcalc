; Production PHP settings for the calculator.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
max_execution_time = 60

; The application enforces 10 files x 5 MB itself; these are the outer bounds.
file_uploads = On
upload_max_filesize = 6M
post_max_size = 64M
max_file_uploads = 12

; The review form round-trips every imported row as form fields, because the
; application stores nothing server-side. PHP drops input variables past this
; limit *silently*, so it has to cover the documented row cap:
;
;   app.rows.max = 5000 records (trades + dividends + fees together)
;   trade row = 21 fields, dividend row = 11 fields, fee row = 9 fields
;   worst case  ~ 5000 * 21 = 105 000, plus form overhead
;
; The application also declares the row count it sent and refuses a POST that
; arrives short, so exceeding this limit produces an error rather than a wrong
; tax figure - but the limit should not be hit in the first place.
max_input_vars = 120000

; Uploads land here, are read once and unlinked immediately by the application.
upload_tmp_dir = /tmp

date.timezone = Europe/Warsaw

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload = /app/config/preload.php
opcache.preload_user = www-data

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessions hold nothing but a CSRF token.
session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
