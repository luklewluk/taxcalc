worker_processes auto;
daemon off;
# The container runs as www-data on a read-only root filesystem. /tmp is the
# explicitly writable tmpfs shared with supervisord and PHP upload/session data.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not log request bodies or query strings: they can carry financial data.
    log_format minimal '$remote_addr - "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout minimal;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Matches the application's own 10 files x 5 MB limit, with headroom.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    server {
        listen 8080;
        server_name _;
        root /app/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Static assets are the only thing worth caching; everything else is
        # marked no-store by the application itself.
        location ~* \.(css|js|ico|svg|png|jpg|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_read_timeout 60s;
            internal;
        }

        # Never execute any other PHP file that might end up in the web root.
        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
