[global]
error_log = /dev/stderr
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Environment passed through from the container.
env[APP_ENV] = $APP_ENV
env[APP_DEBUG] = $APP_DEBUG
env[APP_SECRET] = $APP_SECRET
env[TRUSTED_HOSTS] = $TRUSTED_HOSTS
env[DEFAULT_URI] = $DEFAULT_URI
env[NBP_API_BASE_URL] = $NBP_API_BASE_URL
env[APP_REPOSITORY_URL] = $APP_REPOSITORY_URL
env[DATABASE_URL] = $DATABASE_URL
