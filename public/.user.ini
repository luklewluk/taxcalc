; Read by PHP-FPM for every request under public/ (re-read within
; user_ini.cache_ttl, 5 minutes by default) - no pool reload, no sudo. It
; carries the limits the workbench cannot work without to a server whose pool
; was never configured; a pool that sets them with php_admin_value wins.
; Keep in step with docker/php.ini and deploy/php-fpm/ (PhpLimitsTest).
;
; The workbench posts every row back as form fields, because the server stores
; nothing, and PHP drops variables past max_input_vars *silently* - the form
; then arrives short and the calculation stops. The default of 1000 is about
; 40 trades.
max_input_vars = 120000

; The application enforces 10 files x 5 MB itself; these are the outer bounds.
upload_max_filesize = 6M
post_max_size = 64M
